<!DOCTYPE html>
<html>
<head>
    <title>HTMX Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body class="container mb-4"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <h1>HTMX Practice</h1>
    <button class="btn btn-primary" hx-get="/htmx/hello/" hx-target="#result">Click Now</button>
    <div id="result" class="mt-3"></div>

    <div class="mt-5">
        <h3>Character Counter</h3>
        <input type="text" name="text" class="form-control"
        
                hx-get="/htmx/char-count/"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#char-result">
        
        <div id="char-result" class="mt-2 text-muted"></div>
    </div>

    <div class="mt-5">
        <h3>Like Button</h3>
        {% include "htmx_practice/__like.html" with likes=0 %}
    </div>

    <div class="mt-5">
        <h3>Toggle Button</h3>
        {% include "htmx_practice/_toggle.html" with is_on=False %}
    </div>

   <div class="mt-5">
    <h3>Live Search</h3>
    <input type="text" name="q" class="form-control"
           placeholder="নাম টাইপ করো..."
           hx-get="/htmx/search/"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#search-results">
    <div id="search-results" class="mt-3"></div>
</div>
</body>
</html>
