
{% if is_on %}

    <button class="btn btn-success"
            hx-post="/htmx/toggle/"
            hx-target="this"
            hx-swap="outerHTML">
            Button On
        </button>
{% else %}
    <button class="btn btn-secondary"
    hx-post="/htmx/toggle/"
    hx-target="this"
    hx-swap="outerHTML">
    Button Off
</button>
{% endif %}
